spring.application.name=folio-api
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/folio}
management.endpoints.web.exposure.include=health,info
app.jwt.secret=${JWT_SECRET:local-development-secret-key-replace-with-at-least-32-bytes}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
app.web-origin=${WEB_ORIGIN:http://localhost:5173}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

